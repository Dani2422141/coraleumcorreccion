server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx.
    server_tokens off;

    # Límite de tamaño de las peticiones (la API solo recibe consultas pequeñas).
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Cabeceras de seguridad (aplican a todas las respuestas) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self \"https://dashboard.retellai.com\")" always;
    # La CSP se activa en modo "solo reporte" para no romper el asistente Coral
    # (Retell AI carga recursos externos). Revise la consola del navegador y,
    # cuando no aparezcan avisos, cambie el nombre de la cabecera a
    # "Content-Security-Policy" para aplicarla de verdad.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://dashboard.retellai.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://services.arcgisonline.com https://server.arcgisonline.com https://upload.wikimedia.org https://*.retellai.com; connect-src 'self' https://*.retellai.com wss://*.retellai.com https://*.livekit.cloud wss://*.livekit.cloud; media-src 'self' blob:; frame-src https://*.retellai.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Cuando el sitio se publique con HTTPS, descomente esta línea:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Carga del soporte PDF (máx. 2 MB; el resto de la API sigue limitada a 1 MB).
    location = /api/auth/solicitud/soporte {
        client_max_body_size 3m;
        proxy_pass http://backend:8000/auth/solicitud/soporte;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos generados por Vite (nombre con hash): se pueden cachear mucho tiempo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
