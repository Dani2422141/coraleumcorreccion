trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  azureSubscription: 'coraleum'
  acrName: 'coraleumacr2026'
  containerApp: 'coraleum-frontend'
  resourceGroup: 'rg-coraleum'
  sourcePath: '.'

steps:
  - task: AzureCLI@2
    displayName: Construir y desplegar desde el código fuente
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az extension add --name containerapp --upgrade --only-show-errors
        az containerapp up \
          --name $(containerApp) \
          --resource-group $(resourceGroup) \
          --source $(sourcePath) \
          --registry-server $(acrName).azurecr.io